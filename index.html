<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SANDRO RADIO TV">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e50914">
<title>SANDRO RADIO TV smart edition</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* ... CSS identico a prima ... (per brevità non lo riscrivo, ma è uguale) */
:root {
--primary: #e50914;
--primary-dark: #b2070f;
--primary-glow: rgba(229, 9, 20, 0.3);
--bg-dark: #000000;
--glass-bg: rgba(40, 40, 40, 0.3);
--glass-bg-heavy: rgba(15, 15, 15, 0.65);
--glass-bg-light: rgba(30, 30, 30, 0.55);
--glass-border: rgba(255, 255, 255, 0.08);
--text-primary: #ffffff;
--text-secondary: #8e8e93;
--ios-blue: #007AFF;
--ios-green: #34C759;
--ios-red: #FF3B30;
--ios-orange: #FF9500;
--ios-purple: #AF52DE;
--ios-pink: #FF2D55;
--safe-top: env(safe-area-inset-top, 20px);
--safe-bottom: env(safe-area-inset-bottom, 20px);
--transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
background: var(--bg-dark); color: var(--text-primary);
display: flex; flex-direction: column;
height: 100vh; height: 100dvh;
overflow: hidden; touch-action: manipulation;
-webkit-font-smoothing: antialiased;
padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
}
body::before {
content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: radial-gradient(circle at 20% 30%, rgba(229,9,20,0.08) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(0,122,255,0.05) 0%, transparent 50%);
pointer-events: none; z-index: 0;
}
.app-header {
height: 60px; background: var(--glass-bg-heavy);
backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
border-bottom: 1px solid var(--glass-border);
display: flex; align-items: center; justify-content: space-between;
padding: 0 14px; flex-shrink: 0; z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
width: 38px; height: 38px; border-radius: 10px;
background: linear-gradient(135deg, var(--primary), var(--primary-dark));
display: flex; align-items: center; justify-content: center;
box-shadow: 0 0 20px var(--primary-glow); flex-shrink: 0;
}
.brand-logo svg { width: 20px; height: 20px; color: white; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-title {
font-size: 18px; font-weight: 800;
background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text; letter-spacing: -0.5px;
}
.brand-subtitle { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
.header-status {
display: flex; align-items: center; gap: 5px;
background: rgba(52,199,89,0.1); border: 1px solid rgba(52,199,89,0.12);
padding: 4px 10px; border-radius: 14px;
font-size: 10px; font-weight: 700; color: var(--ios-green);
}
.status-dot { width: 6px; height: 6px; background: var(--ios-green); border-radius: 50%; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.channel-dropdown { position: absolute; top: 12px; left: 12px; z-index: 50; }
.dropdown-toggle {
display: flex; align-items: center; gap: 10px; padding: 12px 18px;
background: var(--glass-bg-heavy);
backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
border: 1px solid var(--glass-border); border-radius: 14px;
color: var(--text-primary); font-size: 16px; font-weight: 700;
cursor: pointer; transition: var(--transition); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.dropdown-toggle:active { transform: scale(0.96); }
.dropdown-toggle svg { width: 20px; height: 20px; transition: transform 0.3s; }
.dropdown-toggle.open svg:last-child { transform: rotate(180deg); }
.dropdown-badge {
background: var(--primary); color: white; padding: 3px 10px;
border-radius: 8px; font-size: 13px; font-weight: 700; min-width: 24px; text-align: center;
}
.dropdown-menu {
position: absolute; top: calc(100% + 10px); left: 0;
width: 420px; max-width: 94vw;
max-height: calc(100dvh - 280px);
background: var(--glass-bg-heavy);
backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
border: 1px solid var(--glass-border); border-radius: 18px;
box-shadow: 0 15px 50px rgba(0,0,0,0.7);
display: none; flex-direction: column; overflow: hidden;
animation: dropdownSlide 0.3s ease;
}
.dropdown-menu.open { display: flex; }
@keyframes dropdownSlide {
from { opacity: 0; transform: translateY(-10px) scale(0.98); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.dropdown-tabs {
display: flex; padding: 10px 14px; gap: 8px;
border-bottom: 1px solid var(--glass-border);
flex-shrink: 0; background: rgba(0,0,0,0.2);
overflow-x: auto; scrollbar-width: none;
}
.dropdown-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
flex-shrink: 0; padding: 12px 14px; border-radius: 10px;
border: none; background: transparent;
color: var(--text-secondary); font-size: 14px; font-weight: 700;
cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.tab-btn:active { transform: scale(0.95); }
.tab-btn.active { background: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--glass-border); }
.tab-content { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
.tab-content.active { display: flex; }
.dropdown-search { padding: 12px 14px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
.search-input-wrapper { position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 14px; width: 20px; height: 20px; color: var(--text-secondary); }
.search-input {
width: 100%; background: var(--glass-bg);
border: 1px solid var(--glass-border); border-radius: 12px;
padding: 12px 14px 12px 44px; color: var(--text-primary);
font-size: 15px; outline: none; transition: var(--transition);
}
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.search-input::placeholder { font-size: 14px; color: var(--text-secondary); }
.dropdown-filters {
padding: 10px 14px; display: flex; gap: 8px;
overflow-x: auto; border-bottom: 1px solid var(--glass-border);
scrollbar-width: none; flex-shrink: 0;
}
.dropdown-filters::-webkit-scrollbar { display: none; }
.filter-chip {
padding: 8px 16px; border-radius: 16px; background: var(--glass-bg);
border: 1px solid var(--glass-border); color: var(--text-secondary);
font-size: 13px; font-weight: 700; cursor: pointer;
white-space: nowrap; transition: var(--transition);
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
.dropdown-list {
flex: 1; overflow-y: auto; overflow-x: hidden;
padding: 6px 0; -webkit-overflow-scrolling: touch; min-height: 0;
}
.dropdown-list::-webkit-scrollbar { width: 4px; }
.dropdown-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
.channel-group-header {
padding: 10px 16px; font-size: 12px; color: var(--text-secondary);
text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
background: rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 10;
}
.channel-option {
display: flex; align-items: center; gap: 12px;
padding: 12px 16px; cursor: pointer;
transition: var(--transition); border-left: 4px solid transparent;
}
.channel-option:active { transform: scale(0.98); }
.channel-option.active { background: linear-gradient(90deg, rgba(229,9,20,0.15), transparent); border-left-color: var(--primary); }
.channel-option-logo {
width: 42px; height: 42px; border-radius: 10px;
background: rgba(255,255,255,0.05);
display: flex; align-items: center; justify-content: center;
font-size: 22px; overflow: hidden; flex-shrink: 0;
}
.channel-option-logo img { width: 100%; height: 100%; object-fit: cover; }
.channel-option-info { flex: 1; overflow: hidden; display: flex; align-items: center; gap: 8px; }
.channel-option-info-text { flex: 1; overflow: hidden; }
.channel-option-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.channel-option-group { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; }
.fav-btn {
background: transparent; border: none; font-size: 20px;
cursor: pointer; padding: 4px 8px; opacity: 0.4;
transition: all 0.2s; flex-shrink: 0;
}
.fav-btn:active { transform: scale(0.8); }
.fav-btn.is-fav { opacity: 1; }
.radio-load-bar {
padding: 10px 14px; border-bottom: 1px solid var(--glass-border);
flex-shrink: 0; display: flex; gap: 8px;
}
.radio-load-btn {
flex: 1; padding: 10px; border-radius: 10px;
background: rgba(255,149,0,0.15); border: 1px solid rgba(255,149,0,0.3);
color: var(--ios-orange); font-size: 13px; font-weight: 700;
cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
transition: all 0.2s;
}
.radio-load-btn:active { transform: scale(0.95); background: rgba(255,149,0,0.3); }
.player-wrapper { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#videoPlayer { width: 100%; height: 100%; object-fit: contain; background: #000; }
#videoPlayer.mode-normal { object-fit: contain; }
#videoPlayer.mode-16-9 { object-fit: cover; }
#videoPlayer.mode-fill { object-fit: fill; }
#videoPlayer.mode-original { object-fit: none; }
.player-placeholder {
position: absolute; top: 0; left: 0; right: 0; bottom: 0;
background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
display: flex; flex-direction: column; align-items: center; justify-content: center;
color: var(--text-secondary);
}
.placeholder-icon { font-size: 50px; margin-bottom: 10px; opacity: 0.5; }
.placeholder-text { font-size: 14px; font-weight: 600; }
.play-overlay {
position: absolute; top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
display: none; flex-direction: column; align-items: center; justify-content: center;
cursor: pointer; z-index: 5;
}
.play-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.play-overlay-btn {
width: 64px; height: 64px; border-radius: 50%; background: var(--primary);
display: flex; align-items: center; justify-content: center;
box-shadow: 0 0 40px rgba(229,9,20,0.5);
}
.play-overlay-btn svg { width: 32px; height: 32px; color: white; margin-left: 4px; }
.play-overlay-text { margin-top: 10px; color: white; font-size: 14px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.buffering-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 6; display: none; }
.buffering-indicator.active { display: block; }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rec-badge {
position: absolute; top: 12px; right: 12px;
background: rgba(255,59,48,0.9); backdrop-filter: blur(10px);
padding: 5px 12px; border-radius: 14px;
display: none; align-items: center; gap: 5px;
font-size: 11px; font-weight: 700; z-index: 10;
}
.rec-badge.active { display: flex; animation: slideIn 0.3s ease; }
.rec-dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: blink 1s infinite; }
.video-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 10; }
.video-flash.flash { animation: flashEffect 0.2s; }
@keyframes flashEffect { 0%{opacity:0} 10%{opacity:0.6} 100%{opacity:0} }
.touch-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 15; cursor: pointer; }
.touch-controls {
position: absolute; bottom: 0; left: 0; right: 0; padding: 15px;
background: linear-gradient(transparent, rgba(0,0,0,0.85));
display: flex; justify-content: flex-end; align-items: center; gap: 12px;
opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 16;
}
.touch-controls.visible { opacity: 1; pointer-events: auto; }
.touch-btn {
background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
color: white; width: 44px; height: 44px; border-radius: 50%;
font-size: 18px; display: flex; align-items: center; justify-content: center;
cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px);
}
.touch-btn:active { background: var(--primary); transform: scale(0.9); }
.touch-btn svg { width: 22px; height: 22px; fill: currentColor; }
.seek-indicator {
position: absolute; top: 50%; transform: translateY(-50%);
color: white; font-size: 22px; font-weight: bold;
background: rgba(0,0,0,0.6); padding: 25px; border-radius: 50%;
opacity: 0; pointer-events: none; z-index: 17; backdrop-filter: blur(10px);
display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.seek-indicator.left { left: 15%; }
.seek-indicator.right { right: 15%; }
.seek-indicator.animate { animation: seekPop 0.7s ease-out forwards; }
@keyframes seekPop {
0% { opacity: 0; transform: translateY(-50%) scale(0.5); }
40% { opacity: 1; transform: translateY(-50%) scale(1.15); }
100% { opacity: 0; transform: translateY(-50%) scale(1); }
}
.seek-indicator .seek-icon { font-size: 28px; }
.seek-indicator .seek-text { font-size: 14px; font-weight: 700; }
.vertical-indicator {
position: absolute; top: 50%; transform: translateY(-50%);
width: 50px; height: 180px; background: rgba(0,0,0,0.7);
border-radius: 25px; display: none; flex-direction: column;
align-items: center; justify-content: flex-end; padding: 10px 5px;
z-index: 18; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
}
.vertical-indicator.left { left: 20px; }
.vertical-indicator.right { right: 20px; }
.vertical-indicator.visible { display: flex; animation: fadeIn 0.2s ease; }
.vertical-indicator .vi-icon { font-size: 22px; margin-bottom: 8px; color: white; }
.vertical-indicator .vi-bar { width: 6px; flex: 1; background: rgba(255,255,255,0.2); border-radius: 3px; position: relative; overflow: hidden; }
.vertical-indicator .vi-fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--primary); border-radius: 3px; transition: height 0.1s ease; }
.vertical-indicator .vi-value { color: white; font-size: 12px; font-weight: 700; margin-top: 8px; }
.channel-switch-indicator {
position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
padding: 20px 30px; border-radius: 16px; color: white;
font-size: 16px; font-weight: 700; display: none;
align-items: center; gap: 12px; z-index: 19;
border: 1px solid rgba(255,255,255,0.2);
}
.channel-switch-indicator.visible { display: flex; animation: seekPop 0.6s ease-out forwards; }
.playlist-popup {
position: absolute; bottom: 100%; left: 50%;
transform: translateX(-50%) translateY(-10px);
width: 380px; max-width: 94vw; max-height: 70vh;
background: var(--glass-bg-heavy);
backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
border: 1px solid var(--glass-border); border-radius: 16px;
box-shadow: 0 15px 50px rgba(0,0,0,0.7);
display: none; flex-direction: column; overflow: hidden;
z-index: 60; margin-bottom: 8px; animation: popupSlide 0.3s ease;
}
.playlist-popup.open { display: flex; }
@keyframes popupSlide {
from { opacity: 0; transform: translateX(-50%) translateY(0); }
to { opacity: 1; transform: translateX(-50%) translateY(-10px); }
}
.playlist-popup-header {
padding: 12px 14px; border-bottom: 1px solid var(--glass-border);
display: flex; justify-content: space-between; align-items: center;
background: rgba(0,0,0,0.2);
}
.playlist-popup-header h3 { font-size: 15px; font-weight: 700; color: var(--primary); }
.playlist-popup-close {
width: 28px; height: 28px; border-radius: 50%;
background: var(--glass-bg); border: 1px solid var(--glass-border);
color: var(--text-primary); font-size: 14px; cursor: pointer;
display: flex; align-items: center; justify-content: center;
}
.playlist-popup-close:active { transform: scale(0.9); background: var(--primary); }
.playlist-popup-list { flex: 1; overflow-y: auto; padding: 6px 0; max-height: 280px; }
.playlist-popup-actions {
padding: 10px; border-top: 1px solid var(--glass-border);
display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
background: rgba(0,0,0,0.3);
}
.playlist-action-btn {
padding: 10px 8px; border-radius: 10px;
background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
color: #ffffff; font-size: 13px; font-weight: 700;
cursor: pointer; display: flex; align-items: center; justify-content: center;
gap: 6px; transition: all 0.2s ease; min-height: 44px;
}
.playlist-action-btn:active { transform: scale(0.95); }
.playlist-action-btn svg { width: 18px; height: 18px; }
.playlist-action-btn.primary { background: linear-gradient(135deg, #e50914, #b2070f); border-color: #e50914; color: white; }
.epg-panel {
position: absolute; top: 70px; right: 12px;
width: 360px; max-width: 90vw; max-height: 70vh;
background: var(--glass-bg-light);
backdrop-filter: blur(25px) saturate(160%); -webkit-backdrop-filter: blur(25px) saturate(160%);
border: 1px solid var(--glass-border); border-radius: 16px;
display: none; flex-direction: column; z-index: 45;
padding: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
animation: dropdownSlide 0.3s ease;
}
.epg-panel.open { display: flex; }
.epg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--glass-border); }
.epg-header h3 { font-size: 16px; font-weight: 700; color: var(--primary); }
.epg-close { width: 32px; height: 32px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-primary); font-size: 16px; cursor: pointer; }
.epg-close:active { transform: scale(0.9); background: var(--primary); }
.epg-list { flex: 1; overflow-y: auto; }
.epg-item { padding: 10px 12px; border-bottom: 1px solid var(--glass-border); border-radius: 8px; margin-bottom: 4px; background: rgba(255,255,255,0.03); }
.epg-item .time { font-size: 12px; color: var(--primary); font-weight: 700; }
.epg-item .title { font-size: 15px; font-weight: 700; margin-top: 2px; }
.epg-item .desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.control-bar {
background: var(--glass-bg-heavy);
backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
border-top: 1px solid var(--glass-border);
padding: 8px 10px 6px 10px; display: flex; flex-direction: column; gap: 6px;
flex-shrink: 0; position: relative;
}
.control-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.main-controls { justify-content: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--glass-border); margin-bottom: 4px; }
.secondary-controls { justify-content: center; flex-wrap: wrap; gap: 6px; }
.url-wrapper {
display: flex; gap: 4px; align-items: center;
background: var(--glass-bg); backdrop-filter: blur(10px);
border: 1px solid var(--glass-border); border-radius: 10px;
padding: 3px 6px; min-height: 40px;
}
.url-wrapper input[type="text"] {
flex: 1; background: transparent; border: none;
padding: 3px 5px; color: var(--text-primary);
font-size: 12px; outline: none; min-width: 70px; max-width: 140px;
}
.url-wrapper input[type="text"]::placeholder { color: var(--text-secondary); font-size: 11px; }
.url-wrapper .ios-btn { padding: 3px 8px; min-height: 30px; font-size: 11px; border-radius: 6px; }
.url-wrapper .ios-btn svg { width: 14px; height: 14px; }
.ios-btn {
display: inline-flex; align-items: center; justify-content: center;
gap: 5px; padding: 8px 12px;
background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
border: 1px solid var(--glass-border); border-radius: 10px;
color: var(--text-primary); font-size: 13px; font-weight: 700;
cursor: pointer; transition: var(--transition); white-space: nowrap; min-height: 44px;
}
.ios-btn:active { transform: scale(0.93); }
.ios-btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
.ios-btn.play-pause { width: 64px; height: 64px; border-radius: 50%; padding: 0; background: linear-gradient(135deg, var(--ios-green), #28a745); border: none; box-shadow: 0 4px 25px rgba(52,199,89,0.35); }
.ios-btn.play-pause svg { width: 32px; height: 32px; }
.ios-btn.play-pause:active { transform: scale(0.92); }

// ============================================================
// STORAGE
// ============================================================
function loadFromStorage() {
  try {
    const rec = localStorage.getItem('sandro_recordings');
    const playlists = localStorage.getItem('sandro_playlists');
    const favorites = localStorage.getItem('sandro_favorites');
    const history = localStorage.getItem('sandro_history');
    const radios = localStorage.getItem('sandro_custom_radios');
    if (rec) App.recordings = JSON.parse(rec);
    if (playlists) App.savedPlaylists = JSON.parse(playlists);
    if (favorites) App.favorites = JSON.parse(favorites);
    if (history) App.history = JSON.parse(history);
    if (radios) {
      const r = JSON.parse(radios);
      if (r && r.length) App.radioChannels = r;
    }
  } catch (e) { console.error('Errore storage:', e); }
}

function saveToStorage() {
  try {
    localStorage.setItem('sandro_recordings', JSON.stringify(App.recordings));
    localStorage.setItem('sandro_playlists', JSON.stringify(App.savedPlaylists));
    localStorage.setItem('sandro_favorites', JSON.stringify(App.favorites));
    localStorage.setItem('sandro_history', JSON.stringify(App.history));
    localStorage.setItem('sandro_custom_radios', JSON.stringify(App.radioChannels));
    if (AppEPG.loaded) localStorage.setItem('sandro_epg', JSON.stringify(AppEPG));
  } catch (e) { console.error('Errore salvataggio:', e); }
}

// ============================================================
// FAVORITES
// ============================================================
function toggleFavorite(channel, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (!channel) return;
  const idx = App.favorites.findIndex(f => f.url === channel.url);
  if (idx >= 0) { App.favorites.splice(idx, 1); showToast('⭐ Rimosso dai preferiti'); }
  else { App.favorites.unshift({ name: channel.name, url: channel.url, logo: channel.logo || '', group: channel.group || 'Preferiti', addedAt: new Date().toISOString() }); showToast('⭐ Aggiunto ai preferiti'); }
  saveToStorage(); renderChannels(); renderRadios(); renderFavorites();
}

function isFavorite(url) { return App.favorites.some(f => f.url === url); }

function renderFavorites() {
  const c = document.getElementById('favoritesList'); if (!c) return;
  if (!App.favorites.length) { c.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-secondary);font-size:13px;">⭐ Nessun preferito</div>'; return; }
  const f = document.createDocumentFragment();
  App.favorites.forEach(ch => {
    const d = document.createElement('div'); d.className = 'channel-option';
    d.innerHTML = '<div class="channel-option-logo">' + (ch.logo && ch.logo.startsWith('http') ? '<img src="' + ch.logo + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📺\'">' : (ch.logo || '📺')) + '</div><div class="channel-option-info"><div class="channel-option-info-text"><div class="channel-option-name">' + escapeHtml(ch.name) + '</div><div class="channel-option-group">⭐ Preferito</div></div><button class="fav-btn is-fav">⭐</button></div>';
    d.addEventListener('click', (e) => { if (e.target.closest('.fav-btn')) toggleFavorite(ch, e); else { const idx = App.channels.findIndex(c2 => c2.url === ch.url); if (idx >= 0) playChannel(ch, idx); else playRadio(ch.url, ch.name); closeDropdown(); } });
    f.appendChild(d);
  });
  c.innerHTML = ''; c.appendChild(f);
}

// ============================================================
// HISTORY
// ============================================================
function addToHistory(channel) {
  if (!channel) return;
  App.history = App.history.filter(h => h.url !== channel.url);
  App.history.unshift({ name: channel.name, url: channel.url, logo: channel.logo || '', group: channel.group || '', watchedAt: new Date().toISOString() });
  if (App.history.length > 50) App.history = App.history.slice(0, 50);
  saveToStorage();
}

function getTimeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'Adesso'; const m = Math.floor(s/60);
  if (m < 60) return m+'m fa'; const h = Math.floor(m/60);
  if (h < 24) return h+'h fa'; const g = Math.floor(h/24);
  return g < 7 ? g+'g fa' : new Date(d).toLocaleDateString('it-IT');
}

function renderHistory() {
  const c = document.getElementById('historyList'); if (!c) return;
  if (!App.history.length) { c.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-secondary);font-size:13px;">📜 Cronologia vuota</div>'; return; }
  const f = document.createDocumentFragment();
  App.history.forEach(ch => {
    const d = document.createElement('div'); d.className = 'channel-option';
    d.innerHTML = '<div class="channel-option-logo">' + (ch.logo && ch.logo.startsWith('http') ? '<img src="' + ch.logo + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📺\'">' : (ch.logo || '📺')) + '</div><div class="channel-option-info"><div class="channel-option-info-text"><div class="channel-option-name">' + escapeHtml(ch.name) + '</div><div class="channel-option-group">📜 ' + getTimeAgo(ch.watchedAt) + '</div></div></div>';
    d.addEventListener('click', () => { const idx = App.channels.findIndex(c2 => c2.url === ch.url); if (idx >= 0) playChannel(ch, idx); else playRadio(ch.url, ch.name); closeDropdown(); });
    f.appendChild(d);
  });
  c.innerHTML = ''; c.appendChild(f);
}

function renderChannels() {
  const c = document.getElementById('channelList'), channels = App.filteredChannels;
  if (!channels || !channels.length) { c.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-secondary);">Nessun canale trovato</div>'; return; }
  const f = document.createDocumentFragment();
  const grouped = channels.reduce((a, ch) => { const g = ch.group || 'Altro'; if (!a[g]) a[g] = []; a[g].push(ch); return a; }, {});
  Object.keys(grouped).sort().forEach(group => {
    const h = document.createElement('div'); h.className = 'channel-group-header'; h.textContent = group + ' (' + grouped[group].length + ')'; f.appendChild(h);
    grouped[group].forEach(ch => {
      const item = document.createElement('div'); item.className = 'channel-option';
      if (App.currentChannel && App.currentChannel.url === ch.url) item.classList.add('active');
      const fav = isFavorite(ch.url);
      item.innerHTML = '<div class="channel-option-logo">' + (ch.logo ? '<img src="' + ch.logo + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📺\'">' : '📺') + '</div><div class="channel-option-info"><div class="channel-option-info-text"><div class="channel-option-name">' + escapeHtml(ch.name) + '</div><div class="channel-option-group">' + escapeHtml(ch.group||'') + '</div></div><button class="fav-btn ' + (fav?'is-fav':'') + '">' + (fav?'⭐':'☆') + '</button></div>';
      item.addEventListener('click', (e) => { if (e.target.closest('.fav-btn')) toggleFavorite(ch, e); else { playChannel(ch, App.channels.indexOf(ch)); closeDropdown(); } });
      f.appendChild(item);
    });
  });
  c.innerHTML = ''; c.appendChild(f);
}

function filterChannels() {
  let f = [...App.channels];
  if (App.currentFilter !== 'all') f = f.filter(ch => ch.group === App.currentFilter);
  if (App.searchQuery) { const q = App.searchQuery.toLowerCase(); f = f.filter(ch => ch.name.toLowerCase().includes(q) || (ch.group && ch.group.toLowerCase().includes(q))); }
  App.filteredChannels = f; renderChannels();
}

function renderRadios() {
  const c = document.getElementById('radioList'), search = document.getElementById('radioSearchInput'), query = search ? search.value.toLowerCase() : '';
  let radios = App.radioChannels;
  if (query) radios = radios.filter(r => r.name.toLowerCase().includes(query) || (r.group && r.group.toLowerCase().includes(query)));
  if (!radios || !radios.length) { c.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-secondary);">Nessuna radio trovata</div>'; return; }
  const grouped = radios.reduce((a, r) => { const g = r.group || 'Altre'; if (!a[g]) a[g] = []; a[g].push(r); return a; }, {});
  const f = document.createDocumentFragment();
  Object.keys(grouped).sort().forEach(group => {
    const h = document.createElement('div'); h.className = 'channel-group-header'; h.textContent = group + ' (' + grouped[group].length + ')'; f.appendChild(h);
    grouped[group].forEach(r => {
      const item = document.createElement('div'); item.className = 'channel-option';
      if (App.currentRadio && App.currentRadio.url === r.url) item.classList.add('active');
      const fav = isFavorite(r.url);
      item.innerHTML = '<div class="channel-option-logo">' + (r.logo||'🎵') + '</div><div class="channel-option-info"><div class="channel-option-info-text"><div class="channel-option-name">' + escapeHtml(r.name) + '</div><div class="channel-option-group">' + escapeHtml(r.group||'') + '</div></div><button class="fav-btn ' + (fav?'is-fav':'') + '">' + (fav?'⭐':'☆') + '</button></div>';
      item.addEventListener('click', (e) => { if (e.target.closest('.fav-btn')) toggleFavorite(r, e); else { playRadio(r.url, r.name); closeDropdown(); } });
      f.appendChild(item);
    });
  });
  c.innerHTML = ''; c.appendChild(f);
}

// ============================================================
// PLAY FUNCTIONS
// ============================================================
function playRadio(url, name) {
  if (!url) { showToast('❌ URL non valido', true); return; }
  const video = document.getElementById('videoPlayer');
  document.getElementById('playerPlaceholder').style.display = 'none';
  if (App.hls) { App.hls.destroy(); App.hls = null; }
  App.currentRadio = { name, url }; App.isPlaying = true; App.currentChannel = null;
  addToHistory({ name, url, logo: '🎵', group: 'Radio' });
  if (url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
    App.hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    App.hls.loadSource(url); App.hls.attachMedia(video);
    App.hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().then(() => { hidePlayOverlay(); updatePlayButton(); showToast('🎵 '+name); requestWakeLock(); }).catch(() => showToast('❌ Errore', true)); });
  } else { video.src = url; video.play().then(() => { hidePlayOverlay(); updatePlayButton(); showToast('🎵 '+name); requestWakeLock(); }).catch(() => showToast('❌ Errore', true)); }
  renderRadios();
}

function playChannel(channel, index) {
  if (!channel || !channel.url) { showToast('❌ Canale non valido', true); return; }
  App.currentChannel = channel; App.currentChannelIndex = index; App.currentRadio = null;
  const video = document.getElementById('videoPlayer');
  document.getElementById('playerPlaceholder').style.display = 'none';
  if (App.hls) { App.hls.destroy(); App.hls = null; }
  video.pause(); video.removeAttribute('src'); video.load(); showPlayOverlay();
  addToHistory(channel);
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    App.hls = new Hls({ enableWorker: true, lowLatencyMode: true, liveSyncDuration: 3, liveMaxLatencyDuration: 10, maxBufferLength: 15, maxMaxBufferLength: 30, backBufferLength: 30, startFragPrefetch: true, testBandwidth: false });
    App.hls.loadSource(channel.url); App.hls.attachMedia(video);
    App.hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().then(() => { hidePlayOverlay(); App.isPlaying = true; updatePlayButton(); showToast('▶ '+channel.name); requestWakeLock(); }).catch(() => showToast('▶ Clicca il video per avviare', 'warning')); });
    App.hls.on(Hls.Events.ERROR, function(event, data) { if (data.fatal) { if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { App.hls.startLoad(); } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { App.hls.recoverMediaError(); } else { App.hls.destroy(); showToast('❌ Stream non disponibile', true); } } });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = channel.url; video.addEventListener('loadedmetadata', function() { video.play().then(() => { hidePlayOverlay(); App.isPlaying = true; updatePlayButton(); requestWakeLock(); }).catch(() => {}); });
  } else { showToast('❌ Formato non supportato', true); }
  renderChannels();
}

function showPlayOverlay() { document.getElementById('playOverlay').classList.add('active'); }
function hidePlayOverlay() { document.getElementById('playOverlay').classList.remove('active'); }

function togglePlayPause() {
  const v = document.getElementById('videoPlayer');
  if (!v.src && !App.hls && !App.currentRadio) { showToast('❌ Seleziona un canale', true); return; }
  if (v.paused) v.play().then(() => requestWakeLock()).catch(() => showToast('❌ Impossibile', true));
  else { v.pause(); releaseWakeLock(); }
}

function previousChannel() {
  if (App.currentMode==='radio') {
    const i=App.radioChannels.findIndex(r=>r.url===(App.currentRadio?App.currentRadio.url:''));

let AppEPG = { data: {}, loaded: false, source: '' };

function generateEPG() {
  const c = document.getElementById('epgList');
  const ch = App.currentChannel;
  if (!ch) {
    c.innerHTML = '<div class="epg-empty">📡 Seleziona un canale per vedere la guida programmi</div>';
    return;
  }

  // Cerca EPG caricata
  const epgKey = ch.name.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
  let programs = null;

  // Cerca match per nome canale
  for (const key in AppEPG.data) {
    if (epgKey.includes(key.toLowerCase()) || key.toLowerCase().includes(epgKey)) {
      programs = AppEPG.data[key]; break;
    }
  }

  if (!programs || !programs.length) {
    c.innerHTML = '<div class="epg-empty">📡 Nessun EPG disponibile per <b>' + escapeHtml(ch.name) + '</b><br><span style="font-size:11px">Carica un file XMLTV per la guida programmi reale</span><br><button class="epg-load-btn" onclick="document.getElementById(\'epgFileInput\').click()">📥 Carica EPG XMLTV</button></div>';
    return;
  }

  const now = new Date();
  let html = '<div style="padding:10px;background:rgba(229,9,20,0.1);border-radius:8px;margin-bottom:10px;"><div style="font-size:12px;color:var(--primary);font-weight:700;">📡 ' + escapeHtml(ch.name) + '</div><div style="font-size:10px;color:var(--text-secondary);">' + (AppEPG.source || 'EPG caricata') + '</div></div>';

  let foundCurrent = false;
  programs.forEach(p => {
    const start = new Date(p.start);
    const stop = new Date(p.stop);
    const isNow = now >= start && now < stop;
    const isPast = stop < now;
    if (isNow) foundCurrent = true;
    const timeStr = start.getHours().toString().padStart(2,'0') + ':' + start.getMinutes().toString().padStart(2,'0');
    const opacity = isPast ? '0.4' : '1';
    const bg = isNow ? 'background:rgba(229,9,20,0.15);border-left:3px solid var(--primary);' : '';
    html += '<div class="epg-item" style="opacity:' + opacity + ';' + bg + '"><div class="time">' + timeStr + (isNow ? ' ● IN ONDA' : '') + '</div><div class="title">' + escapeHtml(p.title) + '</div>' + (p.desc ? '<div class="desc">' + escapeHtml(p.desc) + '</div>' : '') + '</div>';
  });

  c.innerHTML = html;
}

function parseXMLTV(xmlText) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'text/xml');
    const programmes = doc.querySelectorAll('programme');
    const epg = {};
    programmes.forEach(p => {
      const channelId = p.getAttribute('channel');
      if (!channelId) return;
      const start = parseXMLTVDate(p.getAttribute('start'));
      const stop = parseXMLTVDate(p.getAttribute('stop'));
      const title = p.querySelector('title')?.textContent || 'Programma';
      const desc = p.querySelector('desc')?.textContent || '';
      if (!epg[channelId]) epg[channelId] = [];
      epg[channelId].push({ start, stop, title, desc });
    });
    return epg;
  } catch (e) { console.error('EPG parse error:', e); return null; }
}

function parseXMLTVDate(str) {
  if (!str) return new Date();
  // Formato: 20260724120000 +0200
  const y = parseInt(str.substr(0,4)), m = parseInt(str.substr(4,2))-1, d = parseInt(str.substr(6,2));
  const h = parseInt(str.substr(8,2)), min = parseInt(str.substr(10,2));
  return new Date(y, m, d, h, min);
}

function loadEPGFromFile(input) {
  const file = input.files[0]; if (!file) return;
  showToast('⏳ Caricamento EPG...');
  const reader = new FileReader();
  reader.onload = e => {
    const epg = parseXMLTV(e.target.result);
    if (epg) { AppEPG.data = epg; AppEPG.loaded = true; AppEPG.source = file.name; saveToStorage(); showToast('✅ EPG caricata: ' + Object.keys(epg).length + ' canali'); if (App.epgOpen) generateEPG(); }
    else showToast('❌ File EPG non valido', true);
  };
  reader.onerror = () => showToast('❌ Errore lettura EPG', true);
  reader.readAsText(file); input.value = '';
}

function loadEPGFromStorage() {
  try {
    const saved = localStorage.getItem('sandro_epg');
    if (saved) { const data = JSON.parse(saved); AppEPG = data; }
  } catch (e) {}
}

function setupSwipeGestures() {
  const wrapper = document.getElementById('playerWrapper');
  if (!wrapper) return;
  let startX = 0, startY = 0, startTime = 0, isSwiping = false;

  wrapper.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
    isSwiping = true;
  }, { passive: true });

  wrapper.addEventListener('touchmove', function(e) {
    if (!isSwiping || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // Se lo swipe è principalmente orizzontale
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      if (dx > 0) document.getElementById('swipeLeft').classList.add('active');
      else document.getElementById('swipeRight').classList.add('active');
    }
  }, { passive: true });

  wrapper.addEventListener('touchend', function(e) {
    if (!isSwiping) return;
    isSwiping = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startTime;

    document.getElementById('swipeLeft').classList.remove('active');
    document.getElementById('swipeRight').classList.remove('active');

    // Swipe orizzontale rapido (>50px in <400ms)
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50 && dt < 400) {
      if (navigator.vibrate) navigator.vibrate(20);
      if (dx > 0) previousChannel();
      else nextChannel();
    }
  }, { passive: true });
}

function setupTouchControls() {
  const o=document.getElementById('touchOverlay'); if(!o)return;
  o.addEventListener('click',handleTouchClick);
  o.addEventListener('touchstart',handleTouchStart,{passive:true});

  o.addEventListener('touchend',handleTouchEnd,{passive:true});

function handleTouchClick(e) {

function handleTouchStart(e) {

function handleTouchMove(e) {

function handleOrientationChange() {
  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 1024;
  const video = document.getElementById('videoPlayer');
  const hasVideo = video && (video.src || App.hls || App.currentRadio);
  const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);

  if (isLandscape && isMobile && hasVideo) {
    document.body.classList.add('landscape-mode');
    App.isLandscape = true;
    closeDropdown(); closePlaylistPopup();
    if (App.epgOpen) toggleEPG();
    closeRecordingsPanel();

    // Fullscreen nativo
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) { el.requestFullscreen().catch(()=>{}); }
      else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
      else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
      else if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); }
    } catch(e) {}

    // Lock orientation se disponibile
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); } catch(e) {}

    showToast('📱 Schermo intero — swipe per cambiare');
  } else if (!isLandscape && App.isLandscape && !App.manualFullscreen) {
    exitLandscapeMode();
  }
}

function exitLandscapeMode() {
  document.body.classList.remove('landscape-mode');
  App.isLandscape = false;
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    else if (document.mozFullScreenElement) document.mozCancelFullScreen();
  } catch(e) {}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
}

function parseM3U(data) {
  if (!data || typeof data !== 'string') return [];
  const channels = [], lines = data.split('\n');
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      const nm = line.match(/,([^,]+)$/), lg = line.match(/tvg-logo="([^"]+)"/i), gr = line.match(/group-title="([^"]+)"/i);
      cur = { name: nm ? nm[1].trim() : 'Canale', logo: lg ? lg[1] : '', group: gr ? gr[1] : 'Altro', url: '' };
    } else if (line.startsWith('http') && cur) { cur.url = line; channels.push({...cur}); cur = null; }
  }
  return channels.filter(ch => ch.url && ch.name);
}

// ============================================================
// LOAD FUNCTIONS
// ============================================================
function loadPlaylistFromFile(input) {
  const file = input.files[0]; if (!file) return;
  showToast('⏳ Caricamento...');
  const reader = new FileReader();
  reader.onload = e => {
    const channels = parseM3U(e.target.result);
    if (channels.length > 0) {
      App.channels = channels; App.currentFilter = 'all'; filterChannels();
      document.getElementById('channelCount').textContent = App.channels.length;
      showToast('✅ ' + channels.length + ' canali caricati');
    } else showToast('❌ Nessun canale trovato', true);
  };
  reader.onerror = () => showToast('❌ Errore lettura', true);
  reader.readAsText(file); input.value = '';
}

function loadRadioPlaylistFromFile(input) {
  const file = input.files[0]; if (!file) return;
  showToast('⏳ Caricamento radio...');
  const reader = new FileReader();
  reader.onload = e => {
    const items = parseM3U(e.target.result);
    if (items.length > 0) {
      const existingUrls = new Set(App.radioChannels.map(r => r.url));
      let added = 0;
      items.forEach(item => {
        if (!existingUrls.has(item.url)) {
          App.radioChannels.push({ name: item.name, url: item.url, logo: item.logo || '🎵', group: item.group || 'Importate' });
          existingUrls.add(item.url); added++;
        }
      });
      localStorage.setItem('sandro_custom_radios', JSON.stringify(App.radioChannels));
      renderRadios();
      showToast('✅ ' + added + ' radio aggiunte');
    } else showToast('❌ Nessuna radio trovata', true);
  };
  reader.onerror = () => showToast('❌ Errore lettura', true);
  reader.readAsText(file); input.value = '';
}

function loadFromURL() {
  const url = document.getElementById('m3uInput').value.trim(); if (!url) { showToast('❌ URL non valido', true); return; }
  showToast('⏳ Caricamento...');
  fetch(url, { mode: 'cors' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(data => { const ch = parseM3U(data); if (ch.length) { App.channels = ch; App.currentFilter = 'all'; filterChannels(); document.getElementById('channelCount').textContent = ch.length; document.getElementById('m3uInput').value = ''; showToast('✅ ' + ch.length + ' canali'); } else showToast('❌ Nessun canale', true); })
  .catch(() => showToast('❌ Errore caricamento', true));
}

function loadM3UFromURLInput() {
  const url = document.getElementById('urlInput').value.trim(); if (!url) { showToast('❌ URL non valido', true); return; }
  showToast('⏳ Caricamento...');
  fetch(url, { mode: 'cors' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(data => { const ch = parseM3U(data); if (ch.length) { App.channels = ch; App.currentFilter = 'all'; filterChannels(); document.getElementById('channelCount').textContent = ch.length; closeModal('urlModal'); document.getElementById('urlInput').value = ''; showToast('✅ ' + ch.length + ' canali'); } else showToast('❌ Nessun canale', true); })
  .catch(() => showToast('❌ Errore caricamento', true));
}

// ============================================================
// PLAYLIST
// ============================================================
function renderPlaylists() {
  const c = document.getElementById('playlistList');
  if (!App.savedPlaylists.length) { c.innerHTML = '<div style="padding:25px;text-align:center;color:var(--text-secondary);font-size:13px;">📭 Nessuna playlist salvata</div>'; return; }
  c.innerHTML = App.savedPlaylists.map((p, i) => '<div class="channel-option" onclick="loadSavedPlaylist('+i+')" style="cursor:pointer;"><div class="channel-option-logo">📋</div><div class="channel-option-info"><div class="channel-option-info-text"><div class="channel-option-name">'+escapeHtml(p.name)+'</div><div class="channel-option-group">'+p.channels.length+' canali</div></div></div><button class="rec-btn danger" onclick="event.stopPropagation();deletePlaylist('+i+')" style="font-size:12px;">🗑️</button></div>').join('');
}

function loadSavedPlaylist(i) { const p = App.savedPlaylists[i]; if (!p) return; App.channels = [...p.channels]; App.currentFilter = 'all'; filterChannels(); document.getElementById('channelCount').textContent = App.channels.length; closePlaylistPopup(); showToast('✅ "' + p.name + '" caricata'); }

function deletePlaylist(i) { if (!confirm('Eliminare?')) return; App.savedPlaylists.splice(i, 1); saveToStorage(); renderPlaylists(); showToast('🗑️ Eliminata'); }

function savePlaylist() { if (!App.channels || !App.channels.length) { showToast('❌ Nessun canale', true); return; } document.getElementById('playlistNameInput').value = 'Playlist ' + new Date().toLocaleDateString('it-IT'); openModal('savePlaylistModal'); }

function confirmSavePlaylist() {
  const name = document.getElementById('playlistNameInput').value.trim(); if (!name) { showToast('❌ Inserisci un nome', true); return; }
  if (!App.channels || !App.channels.length) { showToast('❌ Nessun canale', true); return; }
  const idx = App.savedPlaylists.findIndex(p => p.name === name);
  const data = { name, date: new Date().toISOString(), channels: [...App.channels] };
  if (idx >= 0) App.savedPlaylists[idx] = data; else App.savedPlaylists.unshift(data);
  saveToStorage(); closeModal('savePlaylistModal'); document.getElementById('playlistNameInput').value = ''; renderPlaylists(); showToast('✅ "' + name + '" salvata');
}

function exportCurrentPlaylistToM3U() {
  if (!App.channels || !App.channels.length) { showToast('❌ Nessun canale', true); return; }
  let m = '#EXTM3U\n'; App.channels.forEach(ch => { m += '#EXTINF:-1' + (ch.logo ? ' tvg-logo="' + ch.logo + '"' : '') + (ch.group ? ' group-title="' + ch.group + '"' : '') + ',' + ch.name + '\n' + ch.url + '\n'; });
  const b = new Blob([m], { type: 'audio/x-mpegurl' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'SANDRO_' + new Date().toISOString().slice(0, 10) + '.m3u'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u); showToast('📤 Esportata');
}

function importPlaylistAsSaved(input) {
  const file = input.files[0]; if (!file) return;
  showToast('⏳ Lettura file...');
  const reader = new FileReader();
  reader.onload = e => {
    const channels = parseM3U(e.target.result);
    if (channels.length > 0) {
      const name = file.name.replace(/\.(m3u|m3u8|txt)$/i, '');
      const idx = App.savedPlaylists.findIndex(p => p.name === name);
      const data = { name, date: new Date().toISOString(), channels };
      if (idx >= 0) App.savedPlaylists[idx] = data; else App.savedPlaylists.unshift(data);
      saveToStorage(); renderPlaylists(); showToast('✅ "' + name + '" importata!');
    } else showToast('❌ Nessun canale valido', true);
  };
  reader.onerror = () => showToast('❌ Errore lettura', true);
  reader.readAsText(file); input.value = '';
}

// ============================================================
// UTILS
// ============================================================
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showToast(message, type) {
  const t=document.getElementById('toast'); if(!t)return;
  document.getElementById('toastMessage').textContent=message;
  let icon='✓',bc='var(--primary)';
  if(type==='error'){icon='✕';bc='var(--ios-red)';}else if(type==='warning'){icon='⚠';bc='var(--ios-orange)';}
  document.getElementById('toastIcon').textContent=icon; t.style.borderLeftColor=bc;
  t.classList.add('show'); clearTimeout(window.toastTimeout);
  window.toastTimeout=setTimeout(()=>t.classList.remove('show'),3000);
}

function escapeHtml(t) { if (!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// ============================================================
// PROGRESS BAR
// ============================================================
function setupProgressBar() {
  const video=document.getElementById('videoPlayer'), bar=document.getElementById('progressBar'), fill=document.getElementById('progressFill');
  const currentDisplay=document.getElementById('currentTimeDisplay'), durationDisplay=document.getElementById('durationDisplay');
  if(!bar||!fill)return;
  video.addEventListener('timeupdate',()=>{if(video.duration){fill.style.width=(video.currentTime/video.duration*100)+'%';currentDisplay.textContent=formatTime(video.currentTime);}});
  video.addEventListener('loadedmetadata',()=>{durationDisplay.textContent=formatTime(video.duration);});
  bar.addEventListener('click',(e)=>{const rect=bar.getBoundingClientRect(),pct=(e.clientX-rect.left)/rect.width;if(video.duration)video.currentTime=pct*video.duration;});
}

function formatTime(seconds){if(!seconds||isNaN(seconds))return'0:00';const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return m+':'+String(s).padStart(2,'0');}

function setupMediaSession() {
  if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('play',()=>togglePlayPause());navigator.mediaSession.setActionHandler('pause',()=>togglePlayPause());navigator.mediaSession.setActionHandler('previoustrack',()=>previousChannel());navigator.mediaSession.setActionHandler('nexttrack',()=>nextChannel());}
}

// ============================================================
// INIT
// ============================================================
async function init() {
  console.log('🚀 SANDRO RADIO TV - Avvio...');
  loadFromStorage();
  loadEPGFromStorage();

  if (!App.radioChannels || !App.radioChannels.length) {
    App.radioChannels = [...DEFAULT_RADIOS];
  }

  // Prova a caricare canali da file M3U locale
  try {
    const m3uResponse = await fetch('ALXtv.m3u', { cache: 'no-cache' });
    if (m3uResponse.ok) {
      const m3uText = await m3uResponse.text();
      const m3uChannels = parseM3U(m3uText);
      if (m3uChannels && m3uChannels.length > 0) {
        App.channels = m3uChannels;
        App.filteredChannels = [...App.channels];
        document.getElementById('channelCount').textContent = App.channels.length;
        showToast('✅ ' + m3uChannels.length + ' canali da ALXtv.m3u');
      } else { throw new Error('M3U vuoto'); }
    } else { throw new Error('ALXtv.m3u non trovato'); }
  } catch (e) {
    // Prova JSON
    try {
      const response = await fetch('channels/italy_channels.json');
      if (response.ok) {
        const data = await response.json();
        if (data.channels && data.channels.length > 0) {
          App.channels = data.channels;
          App.filteredChannels = [...App.channels];
          document.getElementById('channelCount').textContent = App.channels.length;
          showToast('✅ ' + App.channels.length + ' canali da JSON');
        } else { throw new Error('JSON vuoto'); }
      } else { throw new Error('JSON non trovato'); }
    } catch (e2) {
      console.log('📺 Usa canali di default (' + DEFAULT_CHANNELS.length + ' canali)');
      App.channels = [...DEFAULT_CHANNELS];
      App.filteredChannels = [...App.channels];
      document.getElementById('channelCount').textContent = App.channels.length;
      showToast('📺 ' + App.channels.length + ' canali integrati');
    }
  }

  // Prova a caricare radio da M3U
  try {
    const radioResponse = await fetch('ALXradio.m3u', { cache: 'no-cache' });
    if (radioResponse.ok) {
      const radioText = await radioResponse.text();
      const radioItems = parseM3U(radioText);
      if (radioItems && radioItems.length > 0) {
        App.radioChannels = radioItems.map(r => ({ name: r.name, url: r.url, logo: r.logo || '🎵', group: r.group || 'ALXradio' }));
        localStorage.setItem('sandro_custom_radios', JSON.stringify(App.radioChannels));
        showToast('✅ ' + radioItems.length + ' radio da ALXradio.m3u');
      }
    }
  } catch (e) {}

  renderChannels();
  renderRadios();
  renderRecordings();
  renderFavorites();
  renderHistory();
  setupTouchControls();
  setupTouchButtons();
  setupSwipeGestures();
  setupProgressBar();
  setupMediaSession();

  // TAB LISTENERS (fix radio non cliccabile)
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      const tab = btn.dataset.tab;
      const tabEl = document.getElementById('tab-' + tab);
      if (tabEl) tabEl.classList.add('active');
      App.currentMode = tab;
      if (tab === 'radio') renderRadios();
      if (tab === 'favorites') renderFavorites();
      if (tab === 'history') renderHistory();
    });
  });

  // Event listeners
  document.getElementById('dropdownToggle').addEventListener('click', toggleDropdown);

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      App.currentFilter = chip.dataset.filter;
      filterChannels();
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(window.searchTimeout);
    window.searchTimeout = setTimeout(() => { App.searchQuery = e.target.value; filterChannels(); }, 200);
  });

  document.getElementById('radioSearchInput').addEventListener('input', () => {
    clearTimeout(window.radioSearchTimeout);
    window.radioSearchTimeout = setTimeout(renderRadios, 200);
  });

  document.getElementById('playOverlay').addEventListener('click', () => {
    document.getElementById('videoPlayer').play().then(() => { hidePlayOverlay(); App.isPlaying = true; updatePlayButton(); requestWakeLock(); }).catch(() => {});
  });

  const video = document.getElementById('videoPlayer');
  video.addEventListener('play', () => { App.isPlaying = true; updatePlayButton(); hidePlayOverlay(); requestWakeLock(); });
  video.addEventListener('pause', () => { App.isPlaying = false; updatePlayButton(); releaseWakeLock(); });

  document.addEventListener('click', e => {
    const d = document.querySelector('.channel-dropdown');
    if (d && !d.contains(e.target)) closeDropdown();
    const p = document.getElementById('playlistPopup');
    const b = document.getElementById('btnPlaylistToggle');
    if (App.playlistPopupOpen && p && !p.contains(e.target) && !b.contains(e.target)) closePlaylistPopup();
  });

  document.getElementById('btnFilePicker').addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault();
    document.getElementById('m3uFileInput').click();
  });
  document.getElementById('m3uFileInput').addEventListener('change', function() { loadPlaylistFromFile(this); });

  document.getElementById('btnImportPL').addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault();
    document.getElementById('importPlaylistFile').click();
  });
  document.getElementById('importPlaylistFile').addEventListener('change', function() { importPlaylistAsSaved(this); });

  document.getElementById('btnLoadRadioFile').addEventListener('click', function(e) {
    e.stopPropagation(); e.preventDefault();
    document.getElementById('importRadioFile').click();
  });
  document.getElementById('importRadioFile').addEventListener('change', function() { loadRadioPlaylistFromFile(this); });

  document.getElementById('epgFileInput').addEventListener('change', function() { loadEPGFromFile(this); });

  document.getElementById('btnPlaylistToggle').addEventListener('click', function(e) { e.stopPropagation(); togglePlaylistPopup(); });
  document.getElementById('btnSavePL').addEventListener('click', function(e) { e.stopPropagation(); savePlaylist(); });
  document.getElementById('btnRefreshPL').addEventListener('click', function(e) { e.stopPropagation(); renderPlaylists(); });
  document.getElementById('btnExportPL').addEventListener('click', function(e) { e.stopPropagation(); exportCurrentPlaylistToM3U(); });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
    if (e.key === 'ArrowLeft') previousChannel();
    if (e.key === 'ArrowRight') nextChannel();
    if (e.key === 'm' || e.key === 'M') toggleAudio();
    if (e.key === 's' || e.key === 'S') takeScreenshot();
    if (e.key === 'r' || e.key === 'R') toggleRecording();
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    if (e.key === 'Escape') { closeDropdown(); closePlaylistPopup(); if (App.epgOpen) toggleEPG(); if (App.isLandscape) exitLandscapeMode(); document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active')); }
  });

  window.addEventListener('orientationchange', () => setTimeout(handleOrientationChange, 200));
  window.addEventListener('resize', () => { clearTimeout(window.resizeTimeout); window.resizeTimeout = setTimeout(handleOrientationChange, 150); });
  if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(handleOrientationChange, 200));

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !video.paused) requestWakeLock(); });

  setTimeout(handleOrientationChange, 500);
  console.log('✅ App inizializzata - ' + App.channels.length + ' canali caricati');
}

// ============================================================
// AVVIO
// ============================================================
document.addEventListener('DOMContentLoaded', init);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('[SW] Registrato'))
      .catch(e => console.log('[SW] Errore:', e));
  });
}
</script>
